name: borsa-signalbot

on:
  schedule:
    # Gold/NQ ana penceresi: Yahoo kapanmis 5m mumunu yakalamak icin 5 dakikada bir.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 13-16 * * 1-5"
    # Londra: ana bot + AI scout 15 dakikada bir.
    - cron: "2,17,32,47 7-11 * * 1-5"
    # NY seansinin ikinci yarisi: 30 dakikada bir.
    - cron: "7,37 17-20 * * 1-5"
    # BTC ve geciken cronlar icin dort saatlik guvenli yedek.
    - cron: "19 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Telegram'a yollamadan tara"
        required: false
        default: false
        type: boolean
      test_finnhub:
        description: "Finnhub sembollerini canli test et"
        required: false
        default: false
        type: boolean
      test_telegram:
        description: "Telegram'a test mesaji yolla"
        required: false
        default: false
        type: boolean
      test_failure:
        description: "Alarmi dene: bilerek patlat, hata bildirimi gelsin"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: borsa-signalbot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment: telegram bot token
    # Flash + birden cok Pro teyidi 5 dakikayi asabilir; timeout state cache'ini
    # kaybettirip ayni firsatin yeniden bildirilmesine yol acmasin.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Alarmin kendisini test etmek icin. Test edilmemis alarm, alarm degildir.
      # Elle calistir: Actions > Run workflow > "Alarmi dene" isaretli.
      - name: Alarm testi (bilerek basarisiz)
        if: ${{ inputs.test_failure }}
        run: |
          echo "Alarm testi: bu adim bilerek basarisiz oluyor."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: strategy-lab/intraday/signalbot/requirements.txt

      - name: Bagimliliklari kur
        run: pip install -r strategy-lab/intraday/signalbot/requirements.txt

      - name: Onceki sinyal durumunu yukle
        uses: actions/cache/restore@v4
        with:
          path: .signalbot
          key: signalbot-state-${{ github.run_id }}
          restore-keys: |
            signalbot-state-

      - name: Yedi stratejiyi tara
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Environment secret eklenirken bu adla kaydedilmis.
          TELEGRAM_CHAT_ID: ${{ secrets.TEELGRAM_CHAT_ID }}
          # Environment secret eklenirken tek N ile kaydedilmis.
          FINNHUB_API_KEY: ${{ secrets.FINHUB_API_KEY }}
          PHASE: ${{ vars.ACCOUNT_PHASE || 'bnpl_challenge' }}
          ACCOUNT_BALANCE: "5000"
          SIGNALBOT_STATE_PATH: .signalbot/state.json
        run: |
          if [ "${{ inputs.test_finnhub || false }}" = "true" ]; then
            python run_bot.py --test-finnhub
          elif [ "${{ inputs.test_telegram || false }}" = "true" ]; then
            python run_bot.py --test-telegram
          elif [ "${{ inputs.dry_run || false }}" = "true" ]; then
            python run_bot.py --dry-run
          elif [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets henuz eklenmedi; tarama beklemede."
          else
            python run_bot.py
          fi

      # KAPALI (2026-08-01). Acmak icin repo variable: AI_SCOUT_ENABLED=true
      #
      # Neden kapatildi: DeepSeek API'si 402 Payment Required donuyordu (kredi
      # bitmis/hic yuklenmemis). AI scout defteri bu yuzden bugune kadar TAMAMEN
      # BOS kaldi -- tek bir kayit bile uretmedi. continue-on-error: true bu
      # hatayi yutuyordu, adim "success" gorunuyordu.
      #
      # Ikinci gerekce: LLM'in "firsat gordum" demesinin backtest'i, DSR'si,
      # forward kaydi yok. Mekanik modullerin edge'i henuz kanitlanmamisken
      # (bkz overfit_audit.py) olculmemis bir sinyal kaynagi eklemek olcumu
      # zorlastirir. Once mevcut moduller cevap versin.
      - name: DeepSeek AI scout
        if: ${{ vars.AI_SCOUT_ENABLED == 'true' && !inputs.test_finnhub && !inputs.test_telegram && !inputs.dry_run }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TEELGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_SCOUT_STATE_PATH: .signalbot/ai_state.json
          AI_MONTHLY_BUDGET_USD: "2.0"
          AI_MIN_RUN_INTERVAL_MINUTES: "9"
          AI_MIN_REWARD_RISK: "2.0"
          AI_MIN_CONFIDENCE: "80"
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DeepSeek API secret henuz eklenmedi; AI scout beklemede."
          elif [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram Secrets eksik; AI scout beklemede."
          else
            python run_bot.py --ai-scout
          fi

      - name: AI performans raporu
        if: ${{ always() && vars.AI_SCOUT_ENABLED == 'true' }}
        run: |
          report="$(python run_bot.py --ai-report)"
          echo "$report"
          echo "$report" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::notice title=AI Performance::$line"
          done <<< "$report"

      - name: Sinyal durumunu sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .signalbot
          key: signalbot-state-${{ github.run_id }}

      # Sessiz basarisizliga karsi. Bot 15 gun olu kalabildi ve forward EA'nin
      # durdugu fark edilmedi; DeepSeek aylarca 402 dondu, CI hep yesil gorundu.
      # Bu adim bilerek `curl` kullanir (python degil): bildirim, bozulmus
      # olabilecek seye bagimli olmamali.
      - name: Hata bildirimi (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TEELGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secret yok; hata bildirimi atlanamadi."
            exit 0
          fi
          text="SIGNALBOT HATASI
          Workflow: ${{ github.workflow }}
          Calisma: ${{ github.run_id }}
          Commit: ${{ github.sha }}
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$text" >/dev/null || echo "Bildirim gonderilemedi."
