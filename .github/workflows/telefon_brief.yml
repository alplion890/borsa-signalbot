name: telefon brifingi

# NEDEN: diskresyoner ray birincil ray, ama kullanici surekli PC basinda
# olamiyor. Brifing repoya yazilir, telefondaki asistan raw URL'den okur.
# Sunucu kiralamak GEREKMIYOR -- Actions bedava ve bulut defteri zaten burada.

on:
  schedule:
    # Turkiye UTC+3 ve yaz/kis saati uygulamiyor.
    # 13:20 UTC = 16:20 TR: ABD nakit acilisi oncesi hazirlik.
    # 15:15 UTC = 18:15 TR: kayitli diskresyoner pencere baslangici.
    - cron: "20 13 * * 1-5"
    - cron: "15 15 * * 1-5"
  workflow_dispatch:
    inputs:
      notify_telegram:
        description: "Uretilen brifingi Telegram'a da yolla"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: telefon-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    environment: telegram bot token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bulut kosucusuyla AYNI bagimlilik dosyasi: iki liste tutmak bu
      # projedeki tekrar eden hata sinifi.
      - name: Bagimliliklar
        run: pip install -r strategy-lab/intraday/signalbot/requirements.txt

      - name: Brifingi uret
        working-directory: strategy-lab
        env:
          # Signalbot ile AYNI repo degiskeni; funded'a geciste ayrisamaz.
          MAVEN_PHASE: ${{ vars.ACCOUNT_PHASE || 'bnpl_challenge' }}
        run: |
          python -m intraday.forward_ea.telefon_brief
          python -m intraday.forward_ea.telegram_brief --cikti-dir /tmp/telegram-brief

      - name: Repoya isle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TELEFON/BRIEF.md
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "chore(telefon): refresh the phone brief [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push tamam (deneme $attempt)."
              exit 0
            fi
            echo "Push carpisti, tekrar deneniyor ($attempt)."
            sleep 5
          done
          echo "Brifing push edilemedi."
          exit 1

      # Kullanici 2026-09-09'da iki zamanli otomatik gonderime acik onay verdi.
      # Manuel tetikleme ise notify_telegram=true ister. Mesaj emir vermez;
      # Maven/MT5 icrasi yalnizca kullanicinin telefonundan yapilir.
      - name: Iki kisa mesaji Telegram'a yolla
        if: ${{ github.event_name == 'schedule' || inputs.notify_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TEELGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secret yok; seans brifingi gonderilemedi."
            exit 1
          fi
          for file in /tmp/telegram-brief/durum.txt /tmp/telegram-brief/brief.txt; do
            response="$(curl --fail-with-body -sS --max-time 30 \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@${file}")"
            TELEGRAM_RESPONSE="$response" python - <<'PY'
          import hashlib
          import hmac
          import json
          import os

          payload = json.loads(os.environ["TELEGRAM_RESPONSE"])
          if payload.get("ok") is not True:
              raise SystemExit(f"Telegram API teslimati reddetti: {payload.get('description', 'bilinmeyen hata')}")

          result = payload.get("result") or {}
          chat = result.get("chat") or {}
          fingerprint = hmac.new(
              os.environ["TELEGRAM_BOT_TOKEN"].encode(),
              str(chat.get("id", "")).encode(),
              hashlib.sha256,
          ).hexdigest()[:12]
          print(
              "Telegram teslim onayi: "
              f"message_id={result.get('message_id')}, "
              f"chat_type={chat.get('type')}, chat_fingerprint={fingerprint}"
          )
          PY
          done

      # Sessiz basarisizlik = bayat brifing = telefonda eski fiyat. Haberi olsun.
      - name: Hata bildirimi (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Secret bu adla kayitli (harf sirasi ters); diger workflow'lar da ayni.
          TELEGRAM_CHAT_ID: ${{ secrets.TEELGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secret yok; hata bildirimi atlandi."
            exit 0
          fi
          text="TELEFON BRIFINGI HATASI
          Calisma: ${{ github.run_id }}
          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" >/dev/null
